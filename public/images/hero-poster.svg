<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="RepForge hero poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070708"/>
      <stop offset="55%" stop-color="#12121a"/>
      <stop offset="100%" stop-color="#0b1520"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8ff3c"/>
      <stop offset="100%" stop-color="#2ee6ff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1180" cy="220" r="220" fill="#c8ff3c" opacity="0.08"/>
  <circle cx="320" cy="760" r="260" fill="#2ee6ff" opacity="0.07"/>
  <circle cx="780" cy="480" r="180" fill="#9b7bff" opacity="0.08"/>
  <text x="80" y="160" fill="#c8ff3c" font-family="Arial Black, Arial, sans-serif" font-size="64" letter-spacing="4">REPFORGE</text>
  <text x="80" y="240" fill="#f4f4f5" font-family="Arial, sans-serif" font-size="42">Build your best self.</text>
  <text x="80" y="920" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="28">Add public/videos/hero-fitness.mp4 for the looping hero video.</text>
  <path d="M980 620c40-16 120-80 220-96 80-12 180-4 260 20" stroke="url(#accent)" stroke-width="28" stroke-linecap="round" fill="none" opacity="0.9"/>
  <circle cx="970" cy="616" r="24" fill="#c8ff3c"/>
